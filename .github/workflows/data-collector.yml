name: Data Collector 24/7

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: mkdir -p logs
      - uses: actions/cache@v4
        with:
          path: logs
          key: arb-logs-${{ github.run_id }}
          restore-keys: arb-logs-
      - run: npx tsx src/data-collector.ts
        env:
          ALCHEMY_BASE_RPC: https://base-mainnet.g.alchemy.com/v2/alch_BUo0TYqkD24rLEzrz4U3n
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arb-data-${{ github.run_number }}
          path: logs/
          retention-days: 30
      - uses: actions/cache@v4
        if: always()
        with:
          path: logs
          key: arb-logs-${{ github.run_id }}
